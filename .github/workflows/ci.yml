name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freddie
          POSTGRES_PASSWORD: freddie
          POSTGRES_DB: freddie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freddie -d freddie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: End-to-end smoke run
        run: |
          freddie-pipeline generate-sample --out-dir data/smoke --loans 500 --seed 7
          freddie-pipeline run-all --data-dir data/smoke --out reports/smoke
          test -f reports/smoke/summary.md
          test -f reports/smoke/portfolio_summary.csv
          test -f reports/smoke/transition_matrix.csv
          cat reports/smoke/summary.md
