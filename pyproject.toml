[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freddiemac-loan-analytics"
version = "1.0.0"
description = "ELT pipeline and credit risk analytics for the Freddie Mac Single-Family Loan-Level Dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
dependencies = ["psycopg[binary]>=3.1"]

[project.scripts]
freddie-pipeline = "freddie_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires a running Postgres"]
